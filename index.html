<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeerSphere Leaderboard</title>
  <meta name="description" content="Real-time GitHub commit leaderboard for PeerSphere projects. Track daily contributions across teams and contributors.">
  <meta name="theme-color" content="#06090f">

  <!-- Open Graph -->
  <meta property="og:title" content="PeerSphere Leaderboard">
  <meta property="og:description" content="Real-time GitHub commit leaderboard across all PeerSphere projects.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./peersphere.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="PeerSphere Leaderboard">
  <meta name="twitter:description" content="Real-time GitHub commit leaderboard across all PeerSphere projects.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/peersphere.png">
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <a href="./" id="brandLogo"><img src="./peersphere.png" alt="PeerSphere logo"></a>
      <div>
        <h1>PeerSphere <span class="accent">Leaderboard</span></h1>
        <div class="tag">Today's commit leaderboard, across every branch</div>
      </div>
    </div>
    <div class="status">
      <span class="date-chip" id="todayChip">&mdash;</span>
      <span><span class="pulse-dot"></span><span id="lastUpdated">syncing&hellip;</span></span>
      <button id="refreshBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        Refresh
      </button>
    </div>
  </header>

  <div class="stats-bar" id="statsBar">
    <div class="stat-card">
      <div class="stat-icon sc-green">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="3" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="21"/></svg>
      </div>
      <div class="stat-label">Total Commits</div>
      <div class="stat-value" id="statCommits">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon sc-gold">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div class="stat-label">Active Teams</div>
      <div class="stat-value" id="statTeams">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon sc-blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="stat-label">Contributors</div>
      <div class="stat-value" id="statContributors">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon sc-gold">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
      </div>
      <div class="stat-label">Top Team</div>
      <div class="stat-value" id="statTopTeam" style="font-size:15px;">&mdash;</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-view="team">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Group Leaderboard
    </button>
    <button class="tab-btn" data-view="user">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      User Leaderboard
    </button>
  </div>

  <div id="podium" class="podium-stage"></div>
  <div class="board-panel">
    <div class="board-head">
      <span>Rank</span><span id="colLabel">Team</span><span>Activity</span><span>Commits</span>
    </div>
    <div id="listBody"></div>
  </div>

</div>

<div id="toast"></div>

<script>window.__ENV__ = window.__ENV__ || { GH_TOKEN: '' };</script>
<script src="env.js" onerror="console.warn('env.js not found — running without a GitHub token')"></script>
<script src="script.js"></script>
</body>
</html>
